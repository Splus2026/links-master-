# Сборка links_loader.exe для Windows.
#  • Любое изменение кода в main → сборка обновляет релиз «latest»
#    (всегда одна, последняя сборка: links_loader-windows.zip).
#  • Публикация релиза с тегом (v1.2.0 и т.п.) → отдельный ZIP с номером версии.
#  • Вкладка Actions → «Run workflow» → то же, что при изменении кода.
name: Сборка exe

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'links.ini', '.gitignore']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы создавать и обновлять релиз

concurrency:        # если код загрузили ещё раз, прежняя сборка отменяется
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # не собирать дважды: релиз «latest» сам создаётся этим же файлом
    if: github.event_name != 'release' || github.event.release.tag_name != 'latest'
    runs-on: windows-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python (с кэшем pip)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Кэш PyInstaller
        uses: actions/cache@v4
        with:
          path: |
            build
            ~\AppData\Local\pyinstaller
          # кэш берётся только при полностью совпадающем коде — старая сборка не подмешается
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('requirements.txt', '**/*.py') }}

      - name: Установить библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Записать номер сборки
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $date = (Get-Date).ToUniversalTime().AddHours(2).ToString("dd.MM.yyyy HH:mm")
          "BUILD = '${{ github.run_number }}'`nCOMMIT = '$sha'`nDATE = '$date'" |
            Set-Content -Path loader\_build.py -Encoding utf8

      - name: Собрать exe
        run: >
          pyinstaller links_loader.py
          --name links_loader
          --onedir
          --windowed
          --noconfirm
          --collect-submodules loader
          --hidden-import win32com.client
          --hidden-import pythoncom
          --hidden-import gdown
          --collect-all gdown

      - name: Упаковать в ZIP
        shell: pwsh
        run: |
          Copy-Item links.ini, README.md dist\links_loader\
          if ("${{ github.event_name }}" -eq "release") {
            $zip = "links_loader-${{ github.event.release.tag_name }}-windows.zip"
          } else {
            $zip = "links_loader-windows.zip"
          }
          Compress-Archive -Path dist\links_loader -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Сдвинуть тег latest на свежий код
        if: github.event_name != 'release'
        shell: bash
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Обновить релиз «latest»
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          body: |
            Автоматическая сборка из последней версии кода (${{ github.sha }}).
            Скачайте links_loader-windows.zip, распакуйте и запустите links_loader.exe.
          files: ${{ env.ZIP }}
          make_latest: true

      - name: Прикрепить к релизу с версией
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
